<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona Jquery</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
    crossorigin="anonymous">
    </script>
   
    <style>
        #kwadrat { width: 150px; height: 150px; background: lightgray; }
    </style>
</head>
<body>
      <button id="przywitaj">Przywitaj się</button>
      <button id="resetuj">Przywitaj się</button>
  <p id="komunikat"></p>
 
  <div id="kwadrat"></div>
 
  <script>
    $(function() {
      $("button").on("click", function(){
            console.log("Testujemy przycisk v2")
      })
      $("div").click(function(){
            $("#komunikat").prepend("czesc");
            $("#kwadrat").css("background-color","red");
      })
      $("#resetuj").click(function(){
            $("#komunikat").empty();
            $("#kwadrat").css("background-color","lightgray");
      })
    });
  </script>
</html>
