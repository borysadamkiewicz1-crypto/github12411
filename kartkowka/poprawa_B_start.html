<html>
<head>
<meta charset="UTF-8">
<title>Poprawa jQuery – Grupa B</title>
<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
  crossorigin="anonymous">
</script>
<script>
$(function(){
    $("#sklep").css({
        "background-color": "honeydew",
        "margin": "15px",
    });
    $("[href ='#']").odd().css("background-color", "darkgreen").css("color", "white")
    $("#promo").addClass("wyroznione")
    $("a").eq(4).css("font-size", "120%");
    $("[href ='#']").attr("href", "https://pl.wikipedia.org/wiki/Warzywo");
    let produkty = $("a").eq(0);
    console.log(produkty.html());
    let produkty2 = $("#produkty");
    console.log(produkty2.html());
    $("h1").append("<h1>Świeże produkty</h1>");
    
    // $("a").eq(3).prepend($(this));
    // $("#produkty").append('<li><a href="#">Cebula</a></li>');

    $("#dodaj").on("click",function(){
        let produkt = $("#produkt").val();
        let ilosc = $("#ilosc").val();
        if(produkt.length < "" || ilosc.length < ""){
            $("#komunikat").text("Podaj produkt i ilosc!");
        }
    });
    


});
</script>
<style>
body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; }
li { padding: 6px 0; }
#koszyk { width: 120px; height: 120px; background-color: wheat; }
.wyroznione { font-weight: bold; border-left: 5px solid orange; padding-left: 8px; }
.dodany { color: teal; font-style: italic; }
.pelny { background-color: tomato; border: 4px solid darkred; }
</style>
</head>
<body>
<div id="sklep">
  <h1>Warzywniak</h1>
  <ul id="produkty">
    <li><a href="#">Ziemniaki</a></li>
    <li id="promo"><a href="#">Jabłka</a></li>
    <li><a href="#">Gruszki</a></li>
    <li><a href="#">Marchew</a></li>
    <li><a href="#">Pomidory</a></li>
    <li><a href="#">Ogórki</a></li>
  </ul>
</div>

<hr>
<input type="text" id="produkt" placeholder="Nazwa produktu">
<input type="number" id="ilosc" placeholder="Ilość (kg)">
<button id="dodaj">Dodaj produkt</button>
<button id="naDol">Pierwszy na dół</button>
<p id="komunikat"></p>

<hr>
<div id="koszyk"></div>
<p id="sztuki">W koszyku: 0</p>
<button id="oproznij">Opróżnij</button>

<hr>
<input type="checkbox" id="dostawa">
<label for="dostawa">Zamawiam z dostawą do domu</label>
<button id="zamow" disabled>Zamów</button>
</body>
</html>
